name: Release

on:
  release:
    types:
      - published

jobs:
  build:
    if: ${{ github.repository == 'wagtail-nest/wagtailmenus' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U build twine
      - name: Build package
        run: |
          python -m build
          twine check dist/*
